    <path d="M3 12 21 12"/>
    <path d="M7.5 4.21 16.5 19.79"/>
    <path d="M16.5 4.21 7.5 19.79"/>
  </g>
  <g fill="#5c7a6e">
    <circle cx="3" cy="12" r="1.75"/>
    <circle cx="21" cy="12" r="1.75"/>
    <circle cx="7.5" cy="4.21" r="1.75"/>
    <circle cx="16.5" cy="19.79" r="1.75"/>
    <circle cx="16.5" cy="4.21" r="1.75"/>
    <circle cx="7.5" cy="19.79" r="1.75"/>
  </g>
</svg>
