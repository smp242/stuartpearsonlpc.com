<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Asterisk">
  <!-- Stuart Pearson, LPC. Single asterisk: the small form of the asterism.
       Display cut: use above 48px.
       Three rules crossing at 0/60/120 degrees, flat axis, arm radius 9.
       Arm weight 1, tip radius 1.75. -->
