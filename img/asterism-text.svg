    <circle cx="23.5" cy="46.61" r="2.1"/>
    <circle cx="23.5" cy="27.55" r="2.1"/>
    <circle cx="12.5" cy="46.61" r="2.1"/>
    <circle cx="35" cy="37.08" r="2.1"/>
    <circle cx="57" cy="37.08" r="2.1"/>
    <circle cx="40.5" cy="27.55" r="2.1"/>
    <circle cx="51.5" cy="46.61" r="2.1"/>
    <circle cx="51.5" cy="27.55" r="2.1"/>
    <circle cx="40.5" cy="46.61" r="2.1"/>
  </g>
</svg>
